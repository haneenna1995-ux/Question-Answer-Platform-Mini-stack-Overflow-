variables:
  GIT_CLEAN_FLAGS: -ffdx --exclude=node_modules

stages:
  - build
  - test
  - deploy

build-job:
  stage: build
  script:
    - npm install
    - npm run build

test-job:
  stage: test
  script:
    - docker login ghcr.io -u $GITHUB_USERNAME -p $GITHUB_TOKEN
    - docker pull ghcr.io/haneennajjar/qa-backend:latest
    - docker compose -p qa-backend-test -f ..\questions-answers-platform\docker-compose.test.yml up -d
    - sleep 20
    - npm install
    - npm run cy:run
  after_script:
    - docker compose -p qa-backend-test -f ..\questions-answers-platform\docker-compose.test.yml down

deploy-job:
  stage: deploy
  script:
    - docker compose -p qa-frontend down --remove-orphans
    - docker compose -p qa-frontend build
    - docker compose -p qa-frontend up -d
  only:
    - main